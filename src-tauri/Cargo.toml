[package]
name = "reels-studio-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reels_studio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
dirs = "5"
sha2 = "0.10"
hex = "0.4"
# Native file dialogs (Save As / Open) — avoids the silent <a download> path
# that Tauri WebView struggles with on macOS.
rfd = "0.15"
# Base64 lets us stream large blobs through Tauri IPC without the 5x JSON
# overhead of encoding Vec<u8> as a number array (which silently corrupts
# transfers >50MB on macOS WebKit).
base64 = "0.22"

# Embedded MCP server — exposes Reels Studio actions as tools so that a local
# Claude Code / Codex CLI (using the user's own subscription) can chat-control
# the app. Uses Streamable HTTP transport on an ephemeral 127.0.0.1 port.
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server", "macros"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
# Detect `claude` (and later `codex`) CLIs on the user's PATH so the Agents
# settings tab can show real install/auth status before spawning subprocesses.
which = "6"
# Edit ~/.codex/config.toml in-place when we add Codex support (PR4).
toml_edit = "0.22"
# CancellationToken lets the MCP server shut down gracefully when the
# Tauri window closes.
tokio-util = { version = "0.7", features = ["rt"] }

# Process-group signaling on Unix — `tokio::Child::kill` only signals the PID
# leader, which doesn't reach Claude Code's spawned sub-processes. We use
# `killpg` to take down the whole group cleanly.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }
