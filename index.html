<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: {
              'soft':    '0 2px 8px -1px rgba(0,0,0,0.06), 0 1px 4px -1px rgba(0,0,0,0.04)',
              'soft-lg': '0 4px 16px -2px rgba(0,0,0,0.08), 0 2px 8px -2px rgba(0,0,0,0.05)',
              'soft-xl': '0 8px 30px -4px rgba(0,0,0,0.10), 0 4px 14px -4px rgba(0,0,0,0.06)',
              'glow-sm': '0 0 16px -4px rgba(124,58,237,0.20), 0 0 6px -2px rgba(124,58,237,0.12)',
              'glow':    '0 0 24px -4px rgba(124,58,237,0.25), 0 4px 16px -4px rgba(124,58,237,0.12)',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: #0a0a0b; color: #fafafa; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1c1c1f; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        #root { height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation: fade-in 0.3s ease both; }
    </style>
</head>
<body class="bg-[#0a0a0b] text-zinc-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
